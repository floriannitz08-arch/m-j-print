<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&J Designstudio</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:white;font:15px Arial}header,nav,aside{background:#080808;padding:16px;border:1px solid #55421d}header,nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}header img{width:200px}header strong{flex:1}button,input,select,textarea{font:inherit;background:#222;color:white;border:1px solid #80632a;border-radius:5px;padding:9px}button{cursor:pointer}button:hover{border-color:#ffe8a0}button.gold{background:linear-gradient(115deg,#94600f,#fff1b0,#d4a638);color:black;font-weight:bold}main{display:grid;grid-template-columns:230px minmax(0,1fr) 240px;min-height:75vh}aside label{display:block;margin:12px 0}aside input:not([type=color]),aside select,aside textarea{width:100%}#workspace{overflow:auto;background:#292929;padding:30px;text-align:center}#stage{position:relative;margin:30px auto;background:white;box-shadow:0 10px 40px #0008;touch-action:none;overflow:hidden;text-align:left}#stage svg{display:block;width:100%;height:100%}#layers button{display:block;width:100%;margin:5px 0;text-align:left}small{color:#d8bc79}#status{margin:10px;color:#ffe8a0}@media(max-width:850px){main{grid-template-columns:1fr}#workspace{order:-1}aside{padding:10px}header img{width:140px}}</style><header><a href="./"><img src="logo.svg" alt="M&J Print"></a><strong id="title">Designstudio</strong><button id="save">Speichern</button><button id="preview">Vorschau</button><button id="export" class="gold">SVG exportieren</button></header><nav><button id="undo">↶ Rückgängig</button><button id="redo">↷ Wiederholen</button><button id="front">Vorderseite</button><button id="back">Rückseite</button><button id="copyfront">Vorderseite kopieren</button><label>Zoom <input id="zoom" type="range" min="50" max="150" value="100"></label><label><input id="guides" type="checkbox" checked> Hilfslinien</label></nav><main><aside><h3>Gestalten</h3><button id="addtext">+ Text hinzufügen</button><p><button id="upload">+ Bild hochladen</button><input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></p><button id="blank">Leeres Design</button><p><button id="rect">+ Rechteck</button> <button id="circle">+ Kreis</button></p><button id="line">+ Linie</button> <button id="triangle">+ Dreieck</button><p><button id="backgroundPhoto">Foto als Hintergrund</button></p><h3>Vorlagen</h3><button id="classic">Elegant Schwarz-Gold</button><p><button id="minimal">Minimal Weiß</button></p><label>Hintergrund <input id="bg" type="color" value="#ffffff"></label><h3>Ebenen</h3><div id="layers"></div></aside><section id="workspace"><small id="format"></small><div id="stage"></div><div id="status"></div><small>Gestrichelt: Sicherheitsbereich (Demo). Keine verbindliche Druckfreigabe.</small></section><aside><h3>Objekt bearbeiten</h3><div id="props"><label>Text<textarea id="txt"></textarea></label><label>Schrift<select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Impact</option><option>Times New Roman</option><option>Trebuchet MS</option><option>Tahoma</option></select></label><label>Farbe <input type="color" id="color"></label><label>Größe <input id="size" type="number" min="5" max="1000"></label><label>Drehung <input id="angle" type="range" min="-180" max="180"></label><label>Deckkraft <input id="opacity" type="range" min="0" max="100" value="100"></label><label>Position X <input id="posx" type="number"></label><label>Position Y <input id="posy" type="number"></label><button id="bold">Fett</button> <button id="italic">Kursiv</button><p><button id="flip">Horizontal spiegeln</button></p><button id="center">Zentrieren</button><p><button id="dup">Duplizieren</button> <button id="del">Löschen</button></p><button id="up">Nach vorne</button> <button id="down">Nach hinten</button></div><p><small>Bilder und Objekte direkt auf der Fläche verschieben; über Größe skalieren.</small></p></aside></main><script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg',id=new URLSearchParams(location.search).get('product')||'visitenkarten';const formats={visitenkarten:[85,55],flyer:[105,148],falzflyer:[297,210],briefpapier:[210,297],broschueren:[148,210],aufkleber:[80,80],etiketten:[60,40],kartons:[200,150],rollups:[850,2000],banner:[1000,500],plakate:[297,420],schilder:[300,200],shirts:[300,400],hoodies:[300,400],taschen:[250,300],tassen:[200,85],einladungen:[148,105],grusskarten:[148,105],fotobuecher:[210,210],kalender:[210,297],leinwand:[400,300]};const [mmw,mmh]=formats[id]||[85,55],W=600,H=600*mmh/mmw;const blank=()=>({bg:'#ffffff',objects:[]});let state={front:blank(),back:blank()},side='front',selected=-1,history=[],future=[],drag=null,clean=false;const page=()=>state[side],obj=()=>page().objects[selected],clone=x=>JSON.parse(JSON.stringify(x));function snapshot(){history.push(clone(state));if(history.length>35)history.shift();future=[]}function act(fn){snapshot();fn();render()}function el(tag,attrs){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}function svg(preview=false){const s=el('svg',{xmlns:ns,viewBox:'0 0 '+W+' '+H});s.append(el('rect',{width:W,height:H,fill:page().bg}));page().objects.forEach((o,i)=>{const g=el('g',{transform:'translate('+o.x+' '+o.y+') rotate('+o.angle+') scale('+(o.flip?-1:1)+' 1)',opacity:(o.opacity??100)/100,'data-index':i});let n;if(o.type==='text'){n=el('text',{'font-family':o.font,'font-size':o.size,'font-weight':o.bold?'bold':'normal','font-style':o.italic?'italic':'normal',fill:o.color,'text-anchor':'middle','dominant-baseline':'central'});String(o.text).split('\n').forEach((line,j,lines)=>{const t=el('tspan',{x:0,y:(j-(lines.length-1)/2)*o.size*1.2});t.textContent=line;n.append(t)})}else if(o.type==='image'){n=el('image',{href:o.src,x:-o.size/2,y:-o.size/o.ratio/2,width:o.size,height:o.size/o.ratio})}else if(o.type==='circle'){n=el('circle',{r:o.size/2,fill:o.color})}else if(o.type==='line'){n=el('line',{x1:-o.size/2,x2:o.size/2,y1:0,y2:0,stroke:o.color,'stroke-width':5})}else if(o.type==='triangle'){n=el('polygon',{points:'0,'+(-o.size/2)+' '+(o.size/2)+','+(o.size/2)+' '+(-o.size/2)+','+(o.size/2),fill:o.color})}else{n=el('rect',{x:-o.size/2,y:-o.size/3,width:o.size,height:o.size*2/3,fill:o.color})}g.append(n);s.append(g);if(!preview&&i===selected){const b=o.type==='text'?{x:-Math.max(o.size,o.text.length*o.size*.32),y:-o.size*.65,width:Math.max(o.size*2,o.text.length*o.size*.64),height:o.size*1.3}:o.type==='image'?{x:-o.size/2,y:-o.size/o.ratio/2,width:o.size,height:o.size/o.ratio}:o.type==='circle'?{x:-o.size/2,y:-o.size/2,width:o.size,height:o.size}:{x:-o.size/2,y:-o.size/3,width:o.size,height:o.size*2/3};g.prepend(el('rect',{x:b.x-5,y:b.y-5,width:Math.max(10,b.width+10),height:Math.max(10,b.height+10),fill:'none',stroke:'#168cff','stroke-width':2,'pointer-events':'none'}))}});if(!preview&&$('guides').checked){const d=3*W/mmw;s.append(el('rect',{x:d,y:d,width:Math.max(1,W-2*d),height:Math.max(1,H-2*d),fill:'none',stroke:'#e04a4a','stroke-dasharray':'7 5','pointer-events':'none'}))}return s}
function render(){const stage=$('stage');const w=Math.min(650,Math.max(180,$('workspace').clientWidth-65),500*W/H)*Number($('zoom').value)/100;stage.style.width=w+'px';stage.style.height=w*H/W+'px';stage.replaceChildren(svg(clean));$('format').textContent=mmw+' × '+mmh+' mm · Beispiel-Druckfläche · '+(side==='front'?'Vorderseite':'Rückseite');$('bg').value=page().bg;$('layers').replaceChildren();page().objects.forEach((o,i)=>{const b=document.createElement('button');b.textContent=(i===selected?'● ':'')+(o.type==='text'?o.text:o.type==='image'?'Bild':o.type==='circle'?'Kreis':'Rechteck');b.onclick=()=>{selected=i;render()};$('layers').append(b)});const o=obj();$('props').querySelectorAll('input,button,select,textarea').forEach(n=>n.disabled=!o);if(o){$('txt').value=o.text||'';$('font').value=o.font||'Arial';$('color').value=o.color||'#000000';$('size').value=o.size;$('angle').value=o.angle;$('opacity').value=o.opacity??100;$('posx').value=Math.round(o.x);$('posy').value=Math.round(o.y);$('italic').disabled=o.type!=='text';$('txt').disabled=$('font').disabled=$('bold').disabled=o.type!=='text';$('color').disabled=o.type==='image'}$('status').textContent=clean?'Vorschau ohne Hilfslinien':page().objects.length+' Elemente · '+(o?'Objekt ausgewählt':'Kein Objekt ausgewählt')}
function add(type,extra={}){act(()=>{page().objects.push({type,x:W/2,y:H/2,size:type==='text'?36:140,angle:0,color:'#111111',font:'Arial',text:'Dein Text',bold:false,...extra});selected=page().objects.length-1})}function change(k,v){if(obj())act(()=>obj()[k]=v)}$('blank').onclick=()=>{if(confirm('Diese Seite vollständig leeren?'))act(()=>{state[side]=blank();selected=-1})};$('line').onclick=()=>add('line');$('triangle').onclick=()=>add('triangle');$('italic').onclick=()=>change('italic',!obj().italic);$('flip').onclick=()=>change('flip',!obj().flip);for(const [a,k] of [['opacity','opacity'],['posx','x'],['posy','y']])$(a).onchange=()=>change(k,Number($(a).value));$('addtext').onclick=()=>add('text');$('rect').onclick=()=>add('rect');$('circle').onclick=()=>add('circle');let bgUpload=false;$('upload').onclick=()=>{bgUpload=false;$('file').click()};$('backgroundPhoto').onclick=()=>{bgUpload=true;$('file').click()};$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(f.size>4000000){alert('Maximal 4 MB pro Bild in der Demo.');return}const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const ratio=im.width/im.height;if(bgUpload){act(()=>{page().objects.unshift({type:'image',src:reader.result,ratio,size:Math.max(W,H*ratio),x:W/2,y:H/2,angle:0});selected=0})}else add('image',{src:reader.result,ratio,size:220})};im.src=reader.result};reader.readAsDataURL(f);$('file').value=''};for(const [a,k] of [['txt','text'],['font','font'],['color','color'],['size','size'],['angle','angle']])$(a).onchange=()=>change(k,['size','angle'].includes(k)?Number($(a).value):$(a).value);$('bold').onclick=()=>change('bold',!obj().bold);$('bg').onchange=()=>act(()=>page().bg=$('bg').value);$('center').onclick=()=>act(()=>{obj().x=W/2;obj().y=H/2});$('dup').onclick=()=>act(()=>{const o=clone(obj());o.x+=15;o.y+=15;page().objects.push(o);selected=page().objects.length-1});$('del').onclick=()=>act(()=>{page().objects.splice(selected,1);selected=-1});function move(d){const j=selected+d;if(j<0||j>=page().objects.length)return;act(()=>{const a=page().objects;[a[j],a[selected]]=[a[selected],a[j]];selected=j})}$('up').onclick=()=>move(1);$('down').onclick=()=>move(-1);$('undo').onclick=()=>{if(history.length){future.push(clone(state));state=history.pop();selected=-1;render()}};$('redo').onclick=()=>{if(future.length){history.push(clone(state));state=future.pop();selected=-1;render()}};for(const k of ['front','back'])$(k).onclick=()=>{side=k;selected=-1;render()};$('copyfront').onclick=()=>act(()=>{state.back=clone(state.front);side='back';selected=-1});$('zoom').oninput=$('guides').onchange=render;$('preview').onclick=()=>{clean=!clean;$('preview').textContent=clean?'Bearbeiten':'Vorschau';render()};function template(dark){if(page().objects.length&&!confirm('Aktuelles Layout ersetzen?'))return;act(()=>{state[side]={bg:dark?'#000000':'#ffffff',objects:[{type:'text',x:W/2,y:H*.42,size:42,angle:0,color:dark?'#d4af37':'#111111',font:'Arial',text:'DEIN NAME',bold:true},{type:'text',x:W/2,y:H*.58,size:20,angle:0,color:dark?'#ffffff':'#333333',font:'Arial',text:'Deine Botschaft',bold:false}]};selected=-1})}$('classic').onclick=()=>template(true);$('minimal').onclick=()=>template(false);const key='mj-studio-'+id;$('save').onclick=()=>{try{localStorage.setItem(key,JSON.stringify(state));$('status').textContent='Lokal gespeichert'}catch(e){alert('Lokaler Speicher voll. Bitte SVG exportieren.')}};try{const saved=localStorage.getItem(key);if(saved)state=JSON.parse(saved)}catch(e){}$('export').onclick=()=>{const s=svg(true);s.setAttribute('width',mmw+'mm');s.setAttribute('height',mmh+'mm');const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(s)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download=id+'-'+side+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};const stage=$('stage');stage.onpointerdown=e=>{if(clean)return;const g=e.target.closest('[data-index]');selected=g?Number(g.dataset.index):-1;if(obj()){snapshot();drag={x:e.clientX,y:e.clientY,ox:obj().x,oy:obj().y};stage.setPointerCapture(e.pointerId)}render()};stage.onpointermove=e=>{if(!drag||!obj())return;const scale=W/stage.clientWidth;obj().x=drag.ox+(e.clientX-drag.x)*scale;obj().y=drag.oy+(e.clientY-drag.y)*scale;render()};stage.onpointerup=stage.onpointercancel=()=>{drag=null};window.addEventListener('resize',render);document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='Delete'&&obj())$('del').click();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click()}if(obj()&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();act(()=>{const d=e.shiftKey?10:1;obj().x+=e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0;obj().y+=e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0})}});$('title').textContent='Designstudio · '+id;render();
</script></html>
