<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&J Print – Demo</title><style>*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px Arial,sans-serif}header,nav,main,footer{padding:24px max(5vw,16px)}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-bottom:1px solid #73551d}h1,h2,.logo{color:#eac65e}.logo{font-size:30px;font-weight:900}button{background:linear-gradient(115deg,#94600f,#d4a638,#fff1b0,#ebc45e,#96600e,#f9dc83);color:#000;border:0;padding:12px 20px;border-radius:6px;font-weight:bold;cursor:pointer}input,select{background:#151515;color:white;border:1px solid #80632a;padding:12px;border-radius:5px}header input{flex:1;min-width:160px}nav{display:flex;gap:10px;flex-wrap:wrap}nav button{background:#111;color:#eac65e;border:1px solid #80632a}.hero{padding:60px 5%;border:1px solid #80632a;background:radial-gradient(ellipse at right,#594116,#000 65%);border-radius:12px}h1{font-size:clamp(36px,6vw,76px);margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.product{border:1px solid #59451d;border-radius:10px;padding:18px;background:#0c0c0c}.art{height:130px;display:grid;place-items:center;background:linear-gradient(135deg,#171717,#34260e);color:#eac65e;font-size:42px;border-radius:5px}dialog{background:#111;color:white;border:1px solid #d4a638;border-radius:12px;width:min(90vw,540px)}dialog::backdrop{background:#000b}label{display:block;margin:12px 0}canvas{width:100%;border:1px solid #d4a638}footer{color:#bbb}small{color:#eac65e}</style><header><span class="logo">M&J PRINT</span><input id="search" placeholder="Was möchtest du drucken?" aria-label="Produktsuche"><button id="basket">Warenkorb (0)</button></header><nav id="nav"></nav><main><small>Öffentliche Design-Demo · Kein Verkauf · Keine Zahlung</small><section class="hero"><h1>Deine Ideen.<br>Unser Druck.</h1><p>Individuelle Druckprodukte für deinen perfekten Auftritt.</p><button onclick="document.getElementById('products').scrollIntoView()">Jetzt entdecken</button></section><h2 id="products">Unsere Druckprodukte</h2><div class="grid" id="grid"></div></main><footer>M&J Print · Unverbindliche Demo · Alle Preise sind Beispiele.</footer><dialog id="detail"><div id="body"></div><button onclick="detail.close()">Schließen</button></dialog><script>const products=[{"id":"visitenkarten","name":"Visitenkarten","group":"Geschäftsausstattung","price":9.99,"description":"Gestalte Visitenkarten individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"flyer","name":"Flyer","group":"Geschäftsausstattung","price":14.99,"description":"Gestalte Flyer individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"falzflyer","name":"Falzflyer","group":"Geschäftsausstattung","price":19.99,"description":"Gestalte Falzflyer individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"briefpapier","name":"Briefpapier","group":"Geschäftsausstattung","price":18.99,"description":"Gestalte Briefpapier individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"broschueren","name":"Broschüren","group":"Geschäftsausstattung","price":29.99,"description":"Gestalte Broschüren individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"aufkleber","name":"Aufkleber","group":"Aufkleber & Verpackung","price":8.99,"description":"Gestalte Aufkleber individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"etiketten","name":"Etiketten","group":"Aufkleber & Verpackung","price":12.99,"description":"Gestalte Etiketten individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"kartons","name":"Versandkartons","group":"Aufkleber & Verpackung","price":19.99,"description":"Gestalte Versandkartons individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"rollups","name":"Roll-ups","group":"Werbetechnik","price":39.99,"description":"Gestalte Roll-ups individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"banner","name":"Werbebanner","group":"Werbetechnik","price":24.99,"description":"Gestalte Werbebanner individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"plakate","name":"Plakate","group":"Werbetechnik","price":9.99,"description":"Gestalte Plakate individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"schilder","name":"Schilder","group":"Werbetechnik","price":19.99,"description":"Gestalte Schilder individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"shirts","name":"T-Shirts","group":"Textilien & Werbeartikel","price":16.99,"description":"Gestalte T-Shirts individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"hoodies","name":"Hoodies","group":"Textilien & Werbeartikel","price":29.99,"description":"Gestalte Hoodies individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"taschen","name":"Stofftaschen","group":"Textilien & Werbeartikel","price":12.99,"description":"Gestalte Stofftaschen individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"tassen","name":"Tassen","group":"Textilien & Werbeartikel","price":12.99,"description":"Gestalte Tassen individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"einladungen","name":"Einladungen","group":"Karten & Fotogeschenke","price":11.99,"description":"Gestalte Einladungen individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"grusskarten","name":"Grußkarten","group":"Karten & Fotogeschenke","price":9.99,"description":"Gestalte Grußkarten individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"fotobuecher","name":"Fotobücher","group":"Karten & Fotogeschenke","price":24.99,"description":"Gestalte Fotobücher individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"kalender","name":"Fotokalender","group":"Karten & Fotogeschenke","price":12.99,"description":"Gestalte Fotokalender individuell für deinen persönlichen oder geschäftlichen Auftritt."},{"id":"leinwand","name":"Leinwanddrucke","group":"Karten & Fotogeschenke","price":19.99,"description":"Gestalte Leinwanddrucke individuell für deinen persönlichen oder geschäftlichen Auftritt."}],cart=[];let group='',current;const $=id=>document.getElementById(id),money=n=>n.toLocaleString('de-DE',{style:'currency',currency:'EUR'});const icons=['▰','▤','▥','▧','▣','◈','◇'];function render(){const q=$('search').value.toLowerCase();$('grid').innerHTML=products.filter(p=>(!group||p.group===group)&&p.name.toLowerCase().includes(q)).map((p,i)=>'<article class="product"><div class="art">'+icons[i%icons.length]+'</div><h3>'+p.name+'</h3><p>ab '+money(p.price)+'</p><button onclick="openProduct(\''+p.id+'\')">Gestalten</button></article>').join('')}function filter(g){group=g;render()}$('nav').innerHTML=['',...new Set(products.map(p=>p.group))].map(g=>'<button onclick="filter(\''+g+'\')">'+(g||'Alle Produkte')+'</button>').join('');$('search').oninput=render;function openProduct(id){current=products.find(p=>p.id===id);$('body').innerHTML='<h2>'+current.name+'</h2><label>Menge <select id="qty"><option>100</option><option>250</option><option>500</option><option>1000</option></select></label><label>Veredelung <select id="finish"><option>Standard</option><option>Matt</option><option>Goldfolie</option></select></label><label>Designtext <input id="design" value="Deine Ideen"></label><label>Textfarbe <input type="color" id="color" value="#d4af37"></label><canvas id="preview" width="480" height="250"></canvas><p id="price"></p><button onclick="add()">In den Demo-Warenkorb</button><p><small>Vereinfachte Designvorschau</small></p>';for(const id of ['qty','finish','design','color'])$(id).oninput=draw;draw();$('detail').showModal()}function price(){return current.price*({100:1,250:2,500:3,1000:5}[$('qty').value])+({Standard:0,Matt:5,Goldfolie:12}[$('finish').value])}function draw(){const c=$('preview').getContext('2d');c.fillStyle='#000';c.fillRect(0,0,480,250);c.fillStyle=$('color').value;c.font='bold 30px Arial';c.textAlign='center';c.fillText($('design').value,240,135,440);$('price').textContent=money(price())+' · Beispielpreis'}function add(){cart.push({name:current.name,qty:$('qty').value,price:price()});$('basket').textContent='Warenkorb ('+cart.length+')';$('detail').close()}$('basket').onclick=()=>{$('body').innerHTML='<h2>Demo-Warenkorb</h2>'+cart.map((p,i)=>'<p>'+p.name+' · '+p.qty+' · '+money(p.price)+' <button onclick="remove('+i+')">Entfernen</button></p>').join('')+'<h3>Summe: '+money(cart.reduce((s,p)=>s+p.price,0))+'</h3><p>Keine Bestellung möglich.</p>';$('detail').showModal()};function remove(i){cart.splice(i,1);$('basket').textContent='Warenkorb ('+cart.length+')';$('detail').close();$('basket').click()}render();</script></html>
